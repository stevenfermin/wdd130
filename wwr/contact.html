<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="styles/contact.css">
    <title>Contact us</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="Page dedicated to reach the way to contact us an locate our rafting place">
    <meta name="author" content="Steven Fermín">
</head>

<body>
    <header class="grid">
        <img src="images/raftinglogo.png" alt="Logo">
        <div>
            <nav class="flex">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About Us</a></li>
                    <li><a href="trips.html">Trips</a></li>
                    <li><a href="contact.html">Contact Us</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <main>
        <div class="hero">
            <h1>Rafting Company</h1>
            <article>
                <ul>
                    <li>116-140 Co Rd 3,</li>
                    <li>Pierson, Florida</li>
                    <li>+1 386 657 1256</li>
                    <li>info@raftingcompany.com</li>
                </ul>
            </article>
        </div>

        <section class="sub">
            <iframe
              src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3481.323639882963!2d-81.46977272479901!3d29.243442856077472!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x88e6f92d971c6ea9%3A0xedc51a813f1e6c40!2sCo%20Rd%203%2C%20Pierson%2C%20FL%2032180%2C%20EE.%20UU.!5e0!3m2!1ses-419!2sdo!4v1785524596218!5m2!1ses-419!2sdo"
              width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"
              referrerpolicy="strict-origin-when-cross-origin"></iframe>

            <form>
                <div class="info">
                    <label for="name">Name:
                        <input type="text" name="name" id="name" placeholder="Full name"></label>

                    <label for="email">Email:
                        <input type="email" name="email" id="email"
                          placeholder="example@gmail.com"></label>
                </div>

                <div class="purpose">
                    <p>Message purpose</p>
                    <label for=""><input type="radio" name="purpose" id="purpose"
                          value="General Inquiry"> General Inquiry</label>
                    <label for=""><input type="radio" name="purpose" id="purpose"
                          value="Reservation Question"> Reservation Question</label>
                    <label for=""><input type="radio" name="purpose" id="purpose"
                          value="Website Suggestion"> Website Suggestion</label>
                </div>


                <label for="message">Message:</label>
                <textarea name="message" id="message" placeholder="Text here"></textarea>
                <label for="subscribe"><input type="checkbox" name="subscribe" id="subscribe">
                    Please subscribe me to the monthly newsletter</label>
                <button type="submit">Get in Touch!</button>
            </form>
        </section>
        <section>
            <h2>We are here to serve you</h2>
            <p>
                <!--You can raft since small and peacefull rives till the fastest river in the state,
                new landscapes to see, experiences to create awaits for you, what are you waiting?
                Join Now!

                Reach out to us to schedule your travel!

                For competitive purpose, please contact us in our social media and start your new
                journey!-->

            </p>
            <div class="lay">
                <figure>
                    <img src="images/profilelogo.png" alt="Person 1">
                    <figcaption>Employee Profile</figcaption>
                </figure>
                <figure>
                    <img src="images/profilelogo.png" alt="Person 2">
                    <figcaption>Employee Profile</figcaption>
                </figure>
                <figure>
                    <img src="images/profilelogo.png" alt="Person 3">
                    <figcaption>Employee Profile</figcaption>
                </figure>

            </div>
        </section>
    </main>
    <footer>
        <nav class="socialmedia">
            <p>&copy;2026 | Steven Fermin</p>
            <a href="https://facebook.com">
                <img src="images/facebooklogo.png" alt="Facebook">
            </a>
            <a href="https://x.com">
                <img src="images/xlogo.png" alt="x">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagramlogo.png" alt="Instagram">
            </a>
        </nav>
    </footer>

</html>
