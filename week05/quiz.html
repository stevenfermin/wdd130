<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="styles/quiz.css">
    <title>Quiz</title>
</head>

<body>
    <header>
        <h1>QUIZ FORM</h1>
    </header>
    <main>
        <form>
            <div class="column1">
                <label for="q1">What is your name?</label>
                <input type="text" name="q1" id="q1">
            </div>

            <div class="column2">
                <label for="q2">List at least 5 places that you would like to visit:</label>
                <textarea name="q2" id="q2"></textarea>
            </div>

            <div class="column3">
                <label for="q3">How many of those places have you visited?</label>
                <select name="q3" id="q3">
                    <option value="" selected disabled>Choose One ...</option>
                    <option value="0">0</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5+">5+</option>

                </select>
            </div>

            <div class="column4">
                <label for="q4">In how much time you think you will visit one of them? (Specify if
                    is
                    in days/weeks/years)</label>
                <input type="number" name="q4" id="q4">
            </div>

            <button type="submit">Submit quiz</button>
        </form>
    </main>
    <footer></footer>
</body>

</html>
